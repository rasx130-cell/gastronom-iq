<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastronomIQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            padding-bottom: 100px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .cart.show { transform: translateY(0); }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .quantity-btn {
            background: #f0f0f0;
            color: #333;
            padding: 8px 12px;
            margin: 0 4px;
        }
        .total {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="userInfo" class="user-info">
        <div id="userName">Загрузка...</div>
        <div id="userClass" style="font-size: 12px; opacity: 0.8;"></div>
    </div>
    
    <div id="menu"></div>
    
    <div id="cart" class="cart">
        <div class="total">Итого: <span id="total">0</span> ₸</div>
        <div id="cartItems"></div>
        <button onclick="checkout()" style="width: 100%; margin-top: 10px;">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Получаем данные пользователя
        let userId = null;
        let userName = "Гость";
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            userName = tg.initDataUnsafe.user.first_name || "Гость";
            document.getElementById('userName').innerHTML = `👤 ${userName}`;
        } else {
            document.getElementById('userName').innerHTML = `👤 Гость`;
        }
        
        // Firebase
        const db = firebase.initializeApp({ databaseURL: "https://ashana-29903-default-rtdb.firebaseio.com" }).database();
        
        let cart = {};
        
        // Получаем класс пользователя
        if (userId) {
            db.ref(`users/${userId}`).once('value', (snap) => {
                const data = snap.val();
                if (data && data.user_class) {
                    document.getElementById('userClass').innerHTML = `📚 ${data.user_class} класс`;
                }
            });
        }
        
        // Загрузка меню
        db.ref('menu_today').on('value', (snap) => {
            const menu = snap.val();
            const container = document.getElementById('menu');
            container.innerHTML = '';
            
            if (!menu) {
                container.innerHTML = '<div style="text-align:center; padding:40px;">Меню пусто</div>';
                return;
            }
            
            Object.keys(menu).forEach(id => {
                const item = menu[id];
                const count = cart[id] ? cart[id].count : 0;
                
                container.innerHTML += `
                    <div class="card">
                        <div>
                            <strong style="font-size: 18px;">${item.name}</strong>
                            <div style="color: #3b82f6; font-weight: bold; margin-top: 5px;">${item.price} ₸</div>
                        </div>
                        <div>
                            <button class="quantity-btn" onclick="updateCart('${id}', '${item.name}', ${item.price}, -1)">-</button>
                            <span style="margin: 0 10px; font-weight: bold; min-width: 30px; display: inline-block; text-align: center;" id="count-${id}">${count}</span>
                            <button class="quantity-btn" onclick="updateCart('${id}', '${item.name}', ${item.price}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        });
        
        function updateCart(id, name, price, delta) {
            if (!cart[id]) cart[id] = { name, price, count: 0 };
            cart[id].count += delta;
            
            if (cart[id].count <= 0) {
                delete cart[id];
                document.getElementById(`count-${id}`).innerText = '0';
            } else {
                document.getElementById(`count-${id}`).innerText = cart[id].count;
            }
            
            updateCartUI();
        }
        
        function updateCartUI() {
            const cartDiv = document.getElementById('cart');
            let total = 0;
            let count = 0;
            
            Object.values(cart).forEach(item => {
                total += item.price * item.count;
                count += item.count;
            });
            
            if (count > 0) {
                cartDiv.classList.add('show');
                document.getElementById('total').innerText = total;
                
                let itemsHtml = '';
                Object.entries(cart).forEach(([id, item]) => {
                    itemsHtml += `<div style="display: flex; justify-content: space-between; margin: 5px 0;">
                        <span>${item.name} x${item.count}</span>
                        <span>${item.price * item.count} ₸</span>
                    </div>`;
                });
                document.getElementById('cartItems').innerHTML = itemsHtml;
            } else {
                cartDiv.classList.remove('show');
            }
        }
        
        function checkout() {
            if (Object.keys(cart).length === 0) {
                tg.showPopup({ title: 'Корзина пуста', message: 'Добавьте блюда' });
                return;
            }
            
            let items = Object.values(cart).map(i => `${i.name} (x${i.count})`).join(', ');
            let total = Object.values(cart).reduce((s, i) => s + (i.price * i.count), 0);
            
            tg.sendData(JSON.stringify({
                item: items,
                price: total,
                user_id: userId,
                user_name: userName
            }));
            
            tg.showPopup({ 
                title: 'Заказ отправлен!', 
                message: `${userName}, ваш заказ на ${total} ₸ принят!` 
            });
            
            cart = {};
            updateCartUI();
            document.querySelectorAll('[id^="count-"]').forEach(span => span.innerText = '0');
        }
    </script>
</body>
</html>
