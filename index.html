<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastronomIQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 16px;
            padding-bottom: 100px;
        }
        .user-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .dish-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .dish-card:active { transform: scale(0.98); }
        .price { color: #667eea; font-weight: bold; font-size: 18px; margin-top: 5px; }
        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quantity-btn:active { transform: scale(0.9); }
        .cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .cart.show { transform: translateY(0); }
        .checkout-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
        }
        .total { font-size: 24px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="userCard" class="user-card">
        <div id="userName" style="font-size: 20px; font-weight: bold;">👤 Загрузка...</div>
        <div id="userClass" style="font-size: 14px; opacity: 0.9; margin-top: 5px;"></div>
    </div>
    
    <div id="menu"></div>
    
    <div id="cart" class="cart">
        <div class="total">💰 Итого: <span id="total">0</span> ₸</div>
        <div id="cartItems" style="max-height: 200px; overflow-y: auto;"></div>
        <button class="checkout-btn" onclick="checkout()">✅ Оформить заказ</button>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        // Получаем данные пользователя из Telegram
        let userId = null;
        let userName = "Гость";
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            userName = tg.initDataUnsafe.user.first_name || "Гость";
            document.getElementById('userName').innerHTML = `👋 Привет, ${userName}!`;
        } else {
            document.getElementById('userName').innerHTML = `👋 Добро пожаловать!`;
        }
        
        // Firebase
        const firebaseConfig = { databaseURL: "https://ashana-29903-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let cart = {};
        
        // Получаем класс пользователя
        if (userId) {
            db.ref(`users/${userId}`).once('value', (snap) => {
                const data = snap.val();
                if (data && data.user_class) {
                    document.getElementById('userClass').innerHTML = `📚 ${data.user_class} класс`;
                } else {
                    document.getElementById('userClass').innerHTML = `🎒 Выберите класс в боте`;
                }
            });
        }
        
        // Загрузка меню
        db.ref('menu_today').on('value', (snap) => {
            const menu = snap.val();
            const container = document.getElementById('menu');
            container.innerHTML = '';
            
            if (!menu || Object.keys(menu).length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">🍽️ Меню пока пусто</div>';
                return;
            }
            
            Object.entries(menu).forEach(([id, item]) => {
                const count = cart[id] ? cart[id].count : 0;
                
                const card = document.createElement('div');
                card.className = 'dish-card';
                card.innerHTML = `
                    <div>
                        <div style="font-size: 18px; font-weight: 600;">${item.name}</div>
                        <div class="price">${item.price} ₸</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="quantity-btn" onclick="updateCart('${id}', '${item.name}', ${item.price}, -1)">−</button>
                        <span id="count-${id}" style="min-width: 30px; text-align: center; font-weight: bold; font-size: 16px;">${count}</span>
                        <button class="quantity-btn" onclick="updateCart('${id}', '${item.name}', ${item.price}, 1)">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });
        
        function updateCart(id, name, price, delta) {
            if (!cart[id]) cart[id] = { name, price, count: 0 };
            cart[id].count += delta;
            
            if (cart[id].count <= 0) {
                delete cart[id];
                const span = document.getElementById(`count-${id}`);
                if (span) span.innerText = '0';
            } else {
                const span = document.getElementById(`count-${id}`);
                if (span) span.innerText = cart[id].count;
            }
            
            updateCartUI();
        }
        
        function updateCartUI() {
            const cartDiv = document.getElementById('cart');
            let total = 0;
            let totalCount = 0;
            
            const itemsHtml = [];
            Object.entries(cart).forEach(([id, item]) => {
                const itemTotal = item.price * item.count;
                total += itemTotal;
                totalCount += item.count;
                itemsHtml.push(`
                    <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee;">
                        <div>
                            <span style="font-weight: 500;">${item.name}</span>
                            <span style="color: #666; font-size: 12px;"> x${item.count}</span>
                        </div>
                        <span style="font-weight: bold; color: #667eea;">${itemTotal} ₸</span>
                    </div>
                `);
            });
            
            if (totalCount > 0) {
                cartDiv.classList.add('show');
                document.getElementById('total').innerText = total;
                document.getElementById('cartItems').innerHTML = itemsHtml.join('');
            } else {
                cartDiv.classList.remove('show');
            }
        }
        
        function checkout() {
            const items = Object.values(cart);
            if (items.length === 0) {
                tg.showPopup({
                    title: 'Корзина пуста',
                    message: 'Добавьте блюда для оформления заказа',
                    buttons: [{type: 'ok'}]
                });
                return;
            }
            
            const itemsString = items.map(i => `${i.name} (x${i.count})`).join(', ');
            const total = items.reduce((s, i) => s + (i.price * i.count), 0);
            
            // Отправляем заказ в бота
            tg.sendData(JSON.stringify({
                item: itemsString,
                price: total,
                user_id: userId,
                user_name: userName
            }));
            
            tg.showPopup({
                title: '✅ Заказ отправлен!',
                message: `${userName}, ваш заказ на ${total} ₸ принят!\nЖдем вас в столовой!`,
                buttons: [{type: 'ok'}]
            });
            
            // Очищаем корзину
            cart = {};
            updateCartUI();
            document.querySelectorAll('[id^="count-"]').forEach(span => span.innerText = '0');
        }
        
        console.log('WebApp загружен, пользователь:', {userId, userName});
    </script>
</body>
</html>
